<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unusual Volume: the names that traded far more shares than usual</title>
<style>
  :root{
    --ink:#17202b; --soft:#4a5a6d; --faint:#7c8b9d;
    --line:#dde4ec; --bg:#f5f7fa; --card:#ffffff;
    --accent:#0b5fa5;
    --warn-bg:#fdf3e0; --warn-line:#e8c57c; --warn-ink:#6b4e12;
    --bad-bg:#fdeeec; --bad-line:#e5a49c; --bad-ink:#7a2a20;
    --nodata-bg:#eef1f5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 18px 56px}
  header h1{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}
  header .job{font-size:17px;color:var(--soft);margin:0 0 4px;max-width:44em}
  header .free{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 18px}
  .banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15px;display:none}
  .banner.show{display:block}
  .banner.stale{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
  .banner.missing{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink)}
  .meta{font-size:13.5px;color:var(--faint);margin:0 0 20px}
  .def{background:#eef4fb;border:1px solid #bcd4ee;border-radius:14px;
       padding:16px 20px;margin:0 0 22px;font-size:15.5px;color:#23405e}
  .def p{margin:0 0 8px}
  .def p:last-child{margin-bottom:0}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:18px 20px;margin:0 0 16px;font-size:15.5px}
  .summary p{margin:4px 0}
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:18px 20px;margin:0 0 16px}
  .group h2{margin:0 0 10px;font-size:21px}
  table{border-collapse:collapse;width:100%;font-size:14.5px}
  th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:12.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right}
  .mult{font-weight:700;color:var(--accent)}
  .scroll{overflow-x:auto}
  .nodata{background:var(--nodata-bg);border-radius:10px;padding:14px 16px;font-size:15px;margin:0 0 10px}
  footer{margin-top:26px;font-size:13.5px;color:var(--faint);max-width:60em}
  footer p{margin:0 0 8px}
  a{color:var(--accent);font-weight:600}
</style>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../visual.css">
<script src="../shared.js" defer></script>
<script src="../visual.js" defer></script>
<script src="../tool-visual.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Unusual Volume</h1>
    <p class="job">One job: show the names whose share volume on the measured day ran far above their own usual level, ranked by how far above, so you can see where something was happening.</p>
    <p class="free">Free. No account, no sign-up, nothing to buy.</p>
  </header>
  <div class="chartbox" id="vkHost"></div>

  <div id="banner" class="banner" role="status"></div>
  <p id="meta" class="meta">Loading the records&hellip;</p>

  <div class="def" id="defbox"></div>

  <main id="results"></main>

  <footer>
    <p id="receipt"></p>
    <p><a href="../">Back to the free market tools</a></p>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var banner = document.getElementById("banner");
  var meta = document.getElementById("meta");
  var defEl = document.getElementById("defbox");
  var resultsEl = document.getElementById("results");
  var receiptEl = document.getElementById("receipt");
  var DATA = null;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function num(x){ return Number(x).toLocaleString("en-US"); }
  function fmtMult(x){ return Number(x).toFixed(2) + "x"; }
  function fmtDateLong(iso){
    var d = new Date(iso + "T12:00:00Z");
    return d.toLocaleDateString("en-US",{weekday:"long", year:"numeric",
      month:"long", day:"numeric", timeZone:"UTC"});
  }
  function fmtDateShort(iso){
    var d = new Date(iso + "T12:00:00Z");
    return d.toLocaleDateString("en-US",{month:"short", day:"numeric",
      year:"numeric", timeZone:"UTC"});
  }
  function todayKey(){
    var parts = new Intl.DateTimeFormat("en-US",
      {timeZone:"America/New_York", year:"numeric", month:"2-digit",
       day:"2-digit"}).formatToParts(new Date());
    var m = {};
    parts.forEach(function(p){ m[p.type] = p.value; });
    return m.year + "-" + m.month + "-" + m.day;
  }
  function lastCompletedSession(){
    var d = new Date(todayKey() + "T12:00:00Z");
    do { d.setUTCDate(d.getUTCDate() - 1); }
    while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
    return d.toISOString().slice(0, 10);
  }
  function showBanner(kind, text){
    banner.className = "banner show " + kind;
    banner.textContent = text;
  }

  function renderDefs(){
    var d = DATA.definitions || {};
    var h = "<p><strong>How each name is measured:</strong> " +
      esc(d.construction || "") + "</p>";
    h += "<p><strong>The measured day:</strong> " +
      fmtDateLong(DATA.session) + ". <strong>The baseline:</strong> " +
      "each name's own previous " + num(DATA.baseline_sessions) +
      " trading days (for a name that traded every day, " +
      fmtDateShort(DATA.baseline_from) + " to " +
      fmtDateShort(DATA.baseline_to) + ").</p>";
    h += "<p><strong>The floor:</strong> " + esc(d.floor || "") + "</p>";
    h += "<p><strong>Which names are measured:</strong> " +
      esc(d.universe || "") + "</p>";
    h += "<p><strong>Where the volume comes from:</strong> " +
      esc(d.volume_source || "") + "</p>";
    defEl.innerHTML = h;
  }

  function render(){
    var names = DATA.names || [];
    if (!names.length){
      resultsEl.innerHTML = '<div class="nodata">No name ran far ' +
        "above its usual level on " + fmtDateLong(DATA.session) +
        ": every measured name's volume for the day was below " +
        "twice its own usual level. A quiet day is a normal " +
        "result, and nothing is padded to fill the list.</div>";
      return;
    }
    var h = '<section class="summary"><p><strong>' +
      num(names.length) + " names</strong> traded at least twice " +
      "their own usual level on " + fmtDateLong(DATA.session) +
      ", ranked by the multiple, highest first.</p></section>";
    h += '<section class="group"><h2>The names, ranked</h2>' +
      '<div class="scroll"><table><thead><tr>' +
      "<th>Name</th>" +
      '<th class="num">Shares traded on ' +
      fmtDateShort(DATA.session) + "</th>" +
      '<th class="num">Its usual level (average per day, previous ' +
      num(DATA.baseline_sessions) + " trading days)</th>" +
      '<th class="num">How many times its usual level</th>' +
      "</tr></thead><tbody>";
    names.forEach(function(n){
      h += "<tr><td><strong>" + esc(n.symbol) + "</strong></td>" +
        '<td class="num">' + num(n.volume) + "</td>" +
        '<td class="num">' + num(n.usual_volume) + "</td>" +
        '<td class="num mult">' + fmtMult(n.multiple) +
        "</td></tr>";
    });
    h += "</tbody></table></div></section>";
    resultsEl.innerHTML = h;
  }

  fetch("data.json", {cache:"no-store"})
    .then(function(res){
      if (!res.ok) throw new Error("missing");
      return res.json();
    })
    .then(function(data){
      DATA = data;
      if (!data.session || data.state !== "published"){
        meta.textContent = "";
        defEl.innerHTML = "";
        resultsEl.innerHTML = '<div class="nodata">No volume ' +
          "measurement has been published yet. When the records " +
          "are published, the names that ran far above their own " +
          "usual level will be listed here. Nothing is shown " +
          "for a record that has not been made.</div>";
        return;
      }
      renderDefs();
      meta.textContent = "Measured day: " +
        fmtDateLong(data.session) + ". Source: " + data.source + ".";
      if (data.session !== lastCompletedSession()){
        showBanner("stale", "This measurement is for " +
          fmtDateLong(data.session) + ", which is not the most " +
          "recent completed trading day. It is the freshest day " +
          "in the volume history on record; treat it as the last " +
          "published measurement, not today's.");
      }
      receiptEl.textContent = "Receipt: " + data.coverage +
        "; the volume history on record holds " +
        num(data.history_sessions_on_record) + " trading days, " +
        "from " + fmtDateShort(data.history_from) + " to " +
        fmtDateShort(data.history_to) + ".";
      render();
    })
    .catch(function(){
      meta.textContent = "";
      defEl.innerHTML = "";
      showBanner("missing", "Unusual Volume is not available " +
        "right now. The data file for this page could not be " +
        "loaded, so there is nothing honest to show. Please check " +
        "back after the next update.");
    });
})();
</script>
</body>
</html>
