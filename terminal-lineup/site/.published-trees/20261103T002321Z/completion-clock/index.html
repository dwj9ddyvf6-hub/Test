<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completion Clock: how long a move takes, and which side gives way first</title>
<style>
  :root{--ink:#17202b;--soft:#4a5a6d;--faint:#7c8b9d;--line:#dde4ec;--bg:#f5f7fa;--card:#fff;--accent:#0b5fa5;--warn-bg:#fdf3e0;--warn-line:#e8c57c;--warn-ink:#6b4e12;--bad-bg:#fdeeec;--bad-line:#e5a49c;--bad-ink:#7a2a20}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 18px 56px}
  header h1{font-size:30px;margin:0 0 6px}
  header .job{font-size:17px;color:var(--soft);margin:0 0 4px;max-width:44em}
  header .free{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 18px}
  .banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15px;display:none}
  .banner.show{display:block}
  .banner.missing{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink)}
  .meta{font-size:13.5px;color:var(--faint);margin:0 0 20px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
  section.card h2{margin:0 0 8px;font-size:21px}
  section.card h3{margin:16px 0 4px;font-size:17px}
  table{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 10px}
  th,td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
  th{color:var(--soft);font-weight:600}
  .sub{color:var(--soft);font-size:14.5px}
  .claim{font-size:17px;font-weight:600}
  .stamp{display:inline-block;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:8px;padding:2px 10px;font-size:13.5px;font-weight:600;margin:4px 0}
  .haz{font-size:14px}
  .haz td,.haz th{padding:4px 6px;text-align:right}
  .haz td:first-child,.haz th:first-child{text-align:left}
  footer{margin-top:26px;font-size:13.5px;color:var(--faint);max-width:60em}
  a{color:var(--accent);font-weight:600}
</style>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../visual.css">
<script src="../shared.js" defer></script>
<script src="../visual.js" defer></script>
<script src="../engine-visual.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Completion Clock</h1>
    <p class="job">One job: when a defined event gathers a group of stocks, say how long its move is likely to take and which side, up or down, is likely to give way first.</p>
    <p class="free">Free. No account, no sign-up, nothing to buy.</p>
  </header>
  <div class="chartbox" id="vkHost"></div>

  <div id="banner" class="banner" role="status"></div>
  <p id="meta" class="meta">Loading the latest record&hellip;</p>
  <main id="main"></main>

  <footer>
    <p><a href="../">All free market tools</a></p>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var banner=document.getElementById("banner"), meta=document.getElementById("meta"), main=document.getElementById("main");
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function fmtDate(iso){var d=new Date(iso+"T12:00:00Z");return d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",timeZone:"UTC"});}
  function card(title, inner){return '<section class="card"><h2>'+esc(title)+'</h2>'+inner+'</section>';}
  function pc(x){return x==null?"Not on record":Number(x).toFixed(1)+"%";}

  fetch("data.json").then(function(r){if(!r.ok) throw new Error(r.status); return r.json();}).then(function(d){
    meta.textContent="Price history checked through "+fmtDate(d.as_of)+". Source: "+d.source+".";
    var out="";

    out+=card("Still being proven",
      '<p class="sub">This tool is new and its own record is still being built. It earns stronger words only from groups it has written down in advance and had graded, never from the older studies behind it. Its verdict needs 30 matured groups, and its events are not everyday occurrences, so this proving state will take time.</p>');

    // ---- The idea ----
    out+=card("The idea", '<p>'+esc(d.idea)+'</p>'
      +'<p class="sub">'+esc(d.shared_family_note)+'</p>');

    // ---- The live record ----
    var lv=d.live;
    out+=card("The live record",
      '<p>'+esc(lv.words)+'</p>'
      +'<table><tbody>'
      +'<tr><th>Groups entered so far</th><td>'+lv.cohorts_recorded+'</td></tr>'
      +'<tr><th>Groups matured so far</th><td>'+lv.matured+'</td></tr>'
      +'<tr><th>Counted toward the 30 that decide this tool</th><td>'+lv.counted_toward_30+' of 30</td></tr>'
      +'</tbody></table>');

    // ---- The event classes and their timing pictures ----
    var body="";
    d.classes.forEach(function(c){
      body+='<h3>'+esc(c.name)+'</h3><p>'+esc(c.words)+'</p>'
        +'<p class="sub">Can it fire today? '+esc(c.can_fire)+'</p>';
      if(c.prior_stamp){
        body+='<p><span class="stamp">Starting estimate only</span></p><p class="sub">'+esc(c.prior_stamp)+'</p>';
      }
      if(c.record_counts){
        body+='<p class="sub">On record: '+c.record_counts.cards+' map cards, '+c.record_counts.graded_tests+' graded tests, '+c.record_counts.breaks+' breaks.</p>';
      }
      if(c.race && c.race.length){
        body+='<table><thead><tr><th>Within</th><th>Up side first</th><th>Down side first</th><th>Both on one day</th><th>Still running</th><th>Past groups counted</th></tr></thead><tbody>';
        c.race.forEach(function(r){
          body+='<tr><td>'+r.sessions+' trading days</td><td>'+pc(r.up_first_pct)+'</td><td>'+pc(r.down_first_pct)+'</td><td>'+pc(r.both_one_day_pct)+'</td><td>'+pc(r.neither_yet_pct)+'</td><td>'+r.cohorts_counted+'</td></tr>';
        });
        body+='</tbody></table>';
        body+='<p class="sub">'+esc(c.bucket_words)+' Past groups for this class: '+c.history_cohorts+' ('+c.history_cohorts_full60+' of them could be followed for the full 60 days).'+(c.thin?' <strong>Thin:</strong> under the 30 past groups needed for a picture to stand on its own, so treat these chances as a rough guide.':'')+'</p>';
        // hazard, sessions 1..21 in three blocks of 7
        var hz='<p class="sub" style="margin-bottom:0">Chance the race settles on each day, if it is still running:</p><table class="haz"><tbody>';
        for(var row=0;row<3;row++){
          hz+='<tr><td class="sub">Day</td>';
          for(var col=0;col<7;col++) hz+='<td class="sub">'+(row*7+col+1)+'</td>';
          hz+='</tr><tr><td class="sub">Chance</td>';
          for(var col3=0;col3<7;col3++){
            var k=row*7+col3;
            hz+='<td>'+(c.hazard_pct[k]==null?"Not on record":Number(c.hazard_pct[k]).toFixed(1)+"%")+'</td>';
          }
          hz+='</tr>';
        }
        hz+='</tbody></table>';
        body+=hz;
        var dec=(c.deciles_sessions||[]).filter(function(x){return x!=null;});
        if(dec.length){
          body+='<p class="sub">How the waiting time spread out in past groups that settled: the fastest tenth settled by about day '+dec[0]+', a quarter by about day '+dec[2]+', half by about day '+dec[4]+', and nine tenths by about day '+dec[8]+'.</p>';
        }
        body+='<p class="sub">'+(c.median_sessions==null
          ? "Middle settling time: in most past groups the race was still running at 60 trading days, so there is no middle settling time inside the window."
          : "Middle settling time: about "+c.median_sessions+" trading days.")
          +(c.unresolved60_pct!=null? " Still running at 60 days: "+Number(c.unresolved60_pct).toFixed(1)+"% of past groups. Those groups stay in every count as their own outcome, never dropped.":"")
          +'</p>';
      }
    });
    out+=card("The kinds of event, and how long each tends to take", body);

    // ---- History ----
    var h=d.history;
    var hist='<p>'+esc(h.words)+'</p><table><tbody>'
      +'<tr><th>Fear days in the settled record</th><td>'+h.fear_days_settled+'</td></tr>'
      +'<tr><th>Fear-day groups replayed</th><td>'+h.fear_cohorts_replayed+'</td></tr>'
      +'<tr><th>Deep-reset groups replayed</th><td>'+h.deep_reset_days.length+'</td></tr>'
      +'<tr><th>Earnings-day groups replayed</th><td>'+h.earnings_cohorts+'</td></tr>'
      +'<tr><th>Big-gap groups replayed</th><td>'+h.gap_cohorts+'</td></tr>'
      +'<tr><th>All past groups pooled</th><td>'+h.pooled_cohorts+'</td></tr>'
      +'</tbody></table>'
      +'<p class="sub">'+esc(h.fear_days_set_aside)+'</p>'
      +'<p class="sub">The deep-reset replay, in full: '+h.deep_reset_days.map(function(x){return fmtDate(x.date)+" ("+x.pool+" washed-out stocks scored, "+x.matching+" in the top group)";}).join("; ")+'.</p>'
      +'<p class="sub">The expected-move yardstick was checked against the Corrected Band page\'s published bands for SPY and QQQ at 21 trading days and matched to the last decimal shown ('+h.em_check.SPY.ours_pct+'% for SPY, '+h.em_check.QQQ.ours_pct+'% for QQQ).</p>'
      +'<p class="sub">Self-check: '+esc(d.self_test.words)+' Result: '+(d.self_test.passed?"passed.":"FAILED.")+'</p>';
    out+=card("Where the pictures come from", hist);

    // ---- Grading, kill criterion, thin rule ----
    out+=card("How it is graded, and when it retires",
      '<p>'+esc(d.grading_words)+'</p>'
      +'<p class="claim">'+esc(d.kill_criterion)+'</p>'
      +'<p class="sub">'+esc(d.thin_cell_rule)+'</p>');

    main.innerHTML=out;
  }).catch(function(e){
    banner.className="banner show missing";
    banner.textContent="This page's latest record could not be loaded. Nothing is shown rather than something stale.";
    meta.textContent="";
  });
})();
</script>
</body>
</html>
