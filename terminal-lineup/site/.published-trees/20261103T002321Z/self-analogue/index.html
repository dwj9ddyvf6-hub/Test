<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Per-Name Self-Analogue: what did this stock do the last times it was here?</title>
<style>
  :root{--ink:#17202b;--soft:#4a5a6d;--faint:#7c8b9d;--line:#dde4ec;--bg:#f5f7fa;--card:#fff;--accent:#0b5fa5;--bad-bg:#fdeeec;--bad-line:#e5a49c;--bad-ink:#7a2a20}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 18px 56px}
  header h1{font-size:30px;margin:0 0 6px}
  header .job{font-size:17px;color:var(--soft);margin:0 0 4px;max-width:44em}
  header .free{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 18px}
  .banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15px;display:none}
  .banner.show{display:block}
  .banner.missing{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink)}
  .meta{font-size:13.5px;color:var(--faint);margin:0 0 20px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
  section.card h2{margin:0 0 8px;font-size:21px}
  table{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 10px}
  th,td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
  th{color:var(--soft);font-weight:600}
  .sub{color:var(--soft);font-size:14.5px}
  .claim{font-size:17px;font-weight:600}
  .count{font-size:22px;font-weight:700}
  input[type=search]{width:100%;max-width:420px;padding:9px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;margin:4px 0 8px}
  footer{margin-top:26px;font-size:13.5px;color:var(--faint);max-width:60em}
  a{color:var(--accent);font-weight:600}
</style>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../visual.css">
<script src="../shared.js" defer></script>
<script src="../visual.js" defer></script>
<script src="../engine-visual.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Per-Name Self-Analogue</h1>
    <p class="job">One job: forecast a stock's next 21 trading days from the times that same stock was last in the state it is in now.</p>
    <p class="free">Free. No account, no sign-up, nothing to buy.</p>
  </header>
  <div class="chartbox" id="vkHost"></div>

  <div id="banner" class="banner" role="status"></div>
  <p id="meta" class="meta">Loading the latest forecasts&hellip;</p>
  <main id="main"></main>

  <footer>
    <p><a href="../">All free market tools</a></p>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var banner=document.getElementById("banner"), meta=document.getElementById("meta"), main=document.getElementById("main");
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function fmtDate(iso){var d=new Date(iso+"T12:00:00Z");return d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",timeZone:"UTC"});}
  function pct(v){return (v>0?"+":"")+Number(v).toFixed(2)+"%";}
  function card(title, inner){return '<section class="card"><h2>'+esc(title)+'</h2>'+inner+'</section>';}

  fetch("data.json").then(function(r){if(!r.ok) throw new Error(r.status); return r.json();}).then(function(d){
    meta.textContent="Forecasts measured from the close of "+fmtDate(d.as_of_session)+". Prices from: "+d.source;
    var out="";

    out+=card("Still being proven", '<p class="sub">This tool is new and its own record is still being built. It earns stronger words only from forecasts it has published and had graded, never from any older study behind it.</p>');

    out+=card("The claim under test", '<p class="claim">'+esc(d.claim)+'</p><p class="sub">'+esc(d.forecast_explained)+'</p><p class="sub">'+esc(d.dropped_reading)+'</p>');

    // ---- Today's forecasts / waiting state ----
    var L=d.live, W=d.waiting, rows="";
    if(L.forecasts && L.forecasts.length){
      rows+='<input type="search" id="q" placeholder="Type a stock symbol to filter the table">';
      rows+='<table id="ft"><thead><tr><th>Stock</th><th>Low figure for the next 21 trading days</th><th>Middle figure</th><th>High figure</th><th>Past states matched</th></tr></thead><tbody>';
      L.forecasts.forEach(function(f){
        rows+='<tr><td>'+esc(f.symbol)+'</td><td>'+pct(f.low_percent)+'</td><td>'+pct(f.middle_percent)+'</td><td>'+pct(f.high_percent)+'</td><td>'+esc(f.matched_states)+' of '+esc(f.usable_states)+'</td></tr>';
      });
      rows+='</tbody></table>';
      rows+='<p class="sub">The low and high figures are the range the claim above is graded on: the real return should land between them 80 percent of the time.</p>';
    } else {
      rows+='<p><span class="count">0</span> <span class="sub">forecasts today. Every name on record is waiting, for one shared reason.</span></p>';
      rows+='<p class="sub">'+esc(W.reason)+'</p>';
      rows+='<table><tbody>'
        +'<tr><th>Names checked</th><td>'+esc(W.names_checked)+'</td></tr>'
        +'<tr><th>Names with a long enough own history</th><td>'+esc(W.names_qualifying)+'</td></tr>'
        +'<tr><th>Names waiting, own history too short</th><td>'+esc(W.names_waiting)+'</td></tr>'
        +'<tr><th>Own past trading days needed per name</th><td>'+esc(W.sessions_needed_per_name)+'</td></tr>'
        +'<tr><th>Longest own history on the shipped record</th><td>'+esc(W.longest_history_on_record)+' trading days</td></tr>'
        +'</tbody></table>';
      rows+='<p class="sub">When a name does qualify, this section becomes a searchable table: the stock, its low, middle and high figures for the next 21 trading days, and how many of its own past states were matched.</p>';
    }
    out+=card("Today's forecasts", rows);

    // ---- Machinery check ----
    var T=d.self_test;
    out+=card("The machinery, checked end to end", '<p class="sub">'+esc(T.what_it_proves)+'</p>'
      +'<table><tbody>'
      +'<tr><th>Check result</th><td>'+esc(T.state)+'</td></tr>'
      +'<tr><th>Past states the invented stock could be matched against</th><td>'+esc(T.usable_states)+'</td></tr>'
      +'<tr><th>Nearest one-sixth matched</th><td>'+esc(T.matched_states)+'</td></tr>'
      +'<tr><th>Its low, middle and high figures</th><td>'+pct(T.band_percent.low)+', '+pct(T.band_percent.middle)+', '+pct(T.band_percent.high)+'</td></tr>'
      +'<tr><th>What the invented stock actually did over the next 21 trading days</th><td>'+pct(T.realised_percent)+' ('+(T.landed_inside_band?'inside':'outside')+' the range)</td></tr>'
      +'<tr><th>Live record touched by the check</th><td>No. The check ran on a throwaway record, and the live record was verified unchanged.</td></tr>'
      +'</tbody></table>'
      +'<p class="sub">This check proves the machinery runs. It says nothing about whether the forecast is any good; only the live record below can show that.</p>');

    // ---- Live record ----
    out+=card("The live record", '<table><tbody>'
      +'<tr><th>Forecasts published and kept on record</th><td>'+esc(L.forecasts_recorded)+'</td></tr>'
      +'<tr><th>Forecasts graded so far</th><td>'+esc(L.forecasts_graded)+'</td></tr>'
      +'<tr><th>Graded forecasts needed before the retirement test below can run</th><td>'+esc(L.proving_target_graded)+'</td></tr>'
      +'</tbody></table>'
      +'<p class="sub">'+esc(d.coverage_rule)+'</p>'
      +'<p class="sub">'+esc(d.family_note)+'</p>');

    out+=card("When one stock is suspended", '<p class="sub">'+esc(d.suspension_rule)+'</p>');

    out+=card("When this tool retires", '<p class="sub">'+esc(d.kill_criterion)+'</p>');

    main.innerHTML=out;
    var q=document.getElementById("q");
    if(q){ q.addEventListener("input", function(){
      var needle=q.value.trim().toUpperCase(), trs=document.querySelectorAll("#ft tbody tr");
      trs.forEach(function(tr){ tr.style.display = (!needle || tr.textContent.toUpperCase().indexOf(needle)>=0) ? "" : "none"; });
    });}
  }).catch(function(e){
    banner.className="banner show missing";
    banner.textContent="The latest figures could not be loaded. Nothing is shown rather than something out of date.";
    meta.textContent="";
  });
})();
</script>
</body>
</html>
