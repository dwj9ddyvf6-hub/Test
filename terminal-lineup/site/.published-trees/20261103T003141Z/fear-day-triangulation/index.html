<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fear-Day Triangulation: does picking carefully on fear days beat picking at random?</title>
<style>
  :root{--ink:#17202b;--soft:#4a5a6d;--faint:#7c8b9d;--line:#dde4ec;--bg:#f5f7fa;--card:#fff;--accent:#0b5fa5;--warn-bg:#fdf3e0;--warn-line:#e8c57c;--warn-ink:#6b4e12;--bad-bg:#fdeeec;--bad-line:#e5a49c;--bad-ink:#7a2a20}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 18px 56px}
  header h1{font-size:30px;margin:0 0 6px}
  header .job{font-size:17px;color:var(--soft);margin:0 0 4px;max-width:44em}
  header .free{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 18px}
  .banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15px;display:none}
  .banner.show{display:block}
  .banner.missing{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink)}
  .meta{font-size:13.5px;color:var(--faint);margin:0 0 20px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
  section.card h2{margin:0 0 8px;font-size:21px}
  table{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 10px}
  th,td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
  th{color:var(--soft);font-weight:600}
  .sub{color:var(--soft);font-size:14.5px}
  .claim{font-size:17px;font-weight:600}
  .count{font-size:22px;font-weight:700}
  footer{margin-top:26px;font-size:13.5px;color:var(--faint);max-width:60em}
  a{color:var(--accent);font-weight:600}
</style>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../visual.css">
<script src="../shared.js" defer></script>
<script src="../visual.js" defer></script>
<script src="../engine-visual.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fear-Day Triangulation</h1>
    <p class="job">One job: on fear days, test whether stocks that pass three different checks beat stocks picked at random, and retire itself if they do not.</p>
    <p class="free">Free. No account, no sign-up, nothing to buy.</p>
  </header>
  <div class="chartbox" id="vkHost"></div>

  <div id="banner" class="banner" role="status"></div>
  <p id="meta" class="meta">Loading the latest record&hellip;</p>
  <main id="main"></main>

  <footer>
    <p><a href="../">All free market tools</a></p>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var banner=document.getElementById("banner"), meta=document.getElementById("meta"), main=document.getElementById("main");
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function fmtDate(iso){var d=new Date(iso+"T12:00:00Z");return d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",timeZone:"UTC"});}
  function card(title, inner){return '<section class="card"><h2>'+esc(title)+'</h2>'+inner+'</section>';}
  function r2(x){return (x>0?"+":"")+Number(x).toFixed(2)+"R";}
  function r3(x){return (x>0?"+":"")+Number(x).toFixed(3)+"R";}

  fetch("data.json").then(function(r){if(!r.ok) throw new Error(r.status); return r.json();}).then(function(d){
    meta.textContent="Price history checked through "+fmtDate(d.as_of)+". Source: "+d.source;
    var out="";

    out+=card("Still being proven", '<p class="sub">This tool is new and its own record is still being built. It earns stronger words only from fear-day groups it has written down in advance and had graded, never from the older studies behind it. Its verdict needs three matured groups, and fear days are rare, so this proving state will be long.</p>');

    // ---- The idea ----
    out+=card("The idea", '<p>'+esc(d.idea)+'</p>'
      +'<p class="claim">'+esc(d.claim.words)+'</p>'
      +'<p class="sub">'+esc(d.claim.r_explained)+'</p>');

    // ---- The three checks + family discount ----
    var c='<table><thead><tr><th>Check</th><th>What it means</th></tr></thead><tbody>';
    d.checks.forEach(function(ch){
      c+='<tr><td><strong>'+esc(ch.name)+'</strong></td><td>'+esc(ch.words)+'</td></tr>';
    });
    c+='</tbody></table><p class="sub"><strong>How much agreement this really is:</strong> '+esc(d.family_discount)+'</p>';
    out+=card("The three checks", c);

    // ---- The comparison's measured history ----
    var H=d.control_history;
    var h='<p class="sub">'+esc(H.note)+'</p>';
    h+='<table><thead><tr><th>Picked group in the replay</th><th>Cases</th><th>Picked stocks, average result</th><th>Random entries in the same names, average result</th></tr></thead><tbody>';
    H.rows.forEach(function(row){
      h+='<tr><td>Picked group '+esc(row.group)+'</td><td>'+esc(row.cases)+'</td><td>'+esc(r3(row.picked_mean_r))+'</td><td>'+esc(r3(row.random_mean_r))+'</td></tr>';
    });
    h+='</tbody></table><p class="sub">Picked groups averaged '+esc(r2(H.picked_range_r[0]))+' to '+esc(r2(H.picked_range_r[1]))+'; random entries averaged '+esc(r2(H.random_range_r[0]))+' to '+esc(r2(H.random_range_r[1]))+'. The day did the lifting. This engine\'s claim is that the three checks together can add at least +0.10R on top of the random figure.</p>';
    out+=card(H.label, h);

    // ---- How every piece is measured ----
    var D=d.definitions, I=D.insider;
    var m='<table><tbody>'
      +'<tr><th>What counts as a fear day</th><td>'+esc(D.fear_day)+'</td></tr>'
      +'<tr><th>Rising trend</th><td>'+esc(D.rising_trend)+'</td></tr>'
      +'<tr><th>How the deep dip is judged here</th><td>'+esc(D.depth_narrowing)+'</td></tr>'
      +'<tr><th>How the gap share is worked out here</th><td>'+esc(D.gap_share)+'</td></tr>'
      +'<tr><th>The insider record</th><td>Gathered '+esc(fmtDate(I.gathered))+'. '+esc(I.words)+' In that gathering, '+esc(I.names_with_summary)+' of the '+esc(I.names_tracked)+' tracked names carry a summary ('+esc(I.open_buys)+' open-market buys against '+esc(I.open_sells)+' sells across the record), and '+esc(I.zero_sell_names.length)+' names show zero sells: '+esc(I.zero_sell_names.join(", "))+'. The other '+esc(I.names_not_on_record)+' tracked names carry no record at all.</td></tr>'
      +'<tr><th>How trades are entered and left</th><td>'+esc(D.exits)+'</td></tr>'
      +'<tr><th>How the random group is picked</th><td>'+esc(D.random_draw)+'</td></tr>'
      +'</tbody></table>';
    out+=card("How every piece is measured", m);

    // ---- Fear days in the record ----
    var F=d.fear_days_in_record;
    out+=card("Fear days on record", '<p><span class="count">'+esc(F.count)+'</span> <span class="sub">fear days in the fuller price history, and '+esc(F.tool_record.qualifying)+' in the Fear Day List\'s own published record (over '+esc(F.tool_record.sessions_checked)+' checked sessions).</span></p><p class="sub">'+esc(F.words)+'</p>');

    // ---- The labelled history day ----
    var Y=d.history_day;
    var y='<p class="sub"><strong>'+esc(Y.label)+'.</strong> '+esc(fmtDate(Y.date))+': qualified because '+esc(Y.qualified_by.join("; "))+'. SPY changed '+esc(Y.spy_change_pct)+'%, the fear gauge closed at '+esc(Y.vix_close)+' ('+esc(Y.vix_change_pct)+'% on the day).</p>';
    y+='<table><tbody>'
      +'<tr><th>Stocks in a rising trend that day</th><td>'+esc(Y.pool_count)+'</td></tr>'
      +'<tr><th>Gap share needed for the top third</th><td>'+esc(Y.gap_top_third_cut)+' or more</td></tr>'
      +'<tr><th>Stocks in the deepest fifth of their own dips</th><td>'+(Y.depth_only.length? Y.depth_only.map(function(s){return esc(s.symbol)+" (dip rank "+esc(s.depth_percentile)+" of 100, gap share "+esc(s.gap_share)+")";}).join("; ") : "none")+'</td></tr>'
      +'<tr><th>Zero-selling names in the rising-trend pool</th><td>'+esc(Y.zero_sell_names_in_pool.join(", "))+'</td></tr>'
      +'<tr><th>Stocks passing all three checks</th><td>'+(Y.triple.length? esc(Y.triple.join(", ")) : "none: the group was empty")+'</td></tr>'
      +'<tr><th>The random group the fixed rule would have drawn</th><td>'+esc(Y.random_draw.join(", "))+'</td></tr>'
      +'</tbody></table>'
      +'<p class="sub">'+esc(Y.words)+'</p>';
    out+=card("One fear day, worked in full: "+fmtDate(Y.date), y);

    // ---- Live record ----
    var L=d.live;
    var l='<table><tbody>'
      +'<tr><th>Fear-day groups started</th><td>'+esc(L.cohorts_formed)+'</td></tr>'
      +'<tr><th>Groups matured and graded</th><td>'+esc(L.cohorts_matured)+' of '+esc(L.proving_target_cohorts)+' needed for the verdict below</td></tr>'
      +'<tr><th>Forecasts written to the public record</th><td>'+esc(L.records_written)+'</td></tr>'
      +'<tr><th>Forecasts graded so far</th><td>'+esc(L.records_graded)+'</td></tr>'
      +'</tbody></table>';
    if(L.freshest_note){ l+='<p class="sub">'+esc(L.freshest_note)+'</p>'; }
    if(L.missed_fear_days && L.missed_fear_days.length){ l+='<p class="sub">Fear days that passed unrecorded and will never be backfilled: '+esc(L.missed_fear_days.join(", "))+'. They stay out of every figure.</p>'; }
    l+='<p class="sub">'+esc(L.wait)+'</p>'
      +'<p class="sub">'+esc(d.thin_cell_rule)+'</p>';
    out+=card("The live record", l);

    out+=card("When this tool retires itself", '<p class="sub">'+esc(d.kill_criterion)+'</p>');

    // ---- The maths, checked ----
    var T=d.self_test;
    out+=card("The working, checked", '<p class="sub">Before anything is published, the entry-and-exit maths is run on hand-built price paths whose answers are known in advance (a target reached, a stop hit, a day that does both, and the 20-day time limit: '+esc(T.exit_cases_checked)+' cases, all matching), the rising-trend and gap calculations are checked on known series, the random draw is checked to come out the same way every time, and the three-group recording is run end to end on a throwaway copy of the public record ('+esc(T.ledger_arms_checked)+' groups recorded there). Test records never enter the live record. Latest check: passed.</p>');

    main.innerHTML=out;
  }).catch(function(e){
    banner.className="banner show missing";
    banner.textContent="The latest figures could not be loaded. Nothing is shown rather than something out of date.";
    meta.textContent="";
  });
})();
</script>
</body>
</html>
