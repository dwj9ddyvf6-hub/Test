<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Router: one verdict per name, and no call is the default</title>
<style>
  :root{
    --ink:#232a33; --soft:#55626f; --faint:#8593a1;
    --line:#dde1e7; --bg:#f4f4f2; --card:#ffffff;
    --accent:#0b5fa5; --bad-bg:#fdeeec; --bad-line:#e5a49c; --bad-ink:#7a2a20;
    --stone:#eceae6; --stone-line:#cfcabf;
    --call-bg:#eef4ea; --call-line:#b9d2ae; --call-ink:#2f5a24;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 18px 56px}
  header h1{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}
  header .job{font-size:17px;color:var(--soft);margin:0 0 4px;max-width:44em}
  header .free{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 18px}
  .banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15px;display:none}
  .banner.show{display:block}
  .banner.missing{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink)}
  .meta{font-size:13.5px;color:var(--faint);margin:0 0 20px}
  .answer{background:var(--call-bg);border:1px solid var(--call-line);border-radius:14px;
          padding:20px 22px;margin:0 0 16px}
  .answer .big{font-size:30px;font-weight:700;color:var(--call-ink);margin:0 0 6px}
  .answer p{margin:0 0 6px;font-size:15.5px;color:var(--ink);max-width:46em}
  .tag{display:inline-block;border-radius:6px;padding:2px 11px;font-size:13.5px;
       font-weight:600;background:var(--stone);border:1px solid var(--stone-line);color:var(--soft)}
  .counts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
  .count{border-radius:10px;padding:10px 14px;font-size:15px;border:1px solid var(--line);background:var(--card)}
  .count strong{font-size:19px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:18px 20px;margin:0 0 16px}
  section.card h2{margin:0 0 8px;font-size:21px}
  section.card h3{margin:16px 0 4px;font-size:16.5px}
  section.card p{color:var(--soft);font-size:15px;margin:0 0 8px;max-width:48em}
  section.card p strong{color:var(--ink)}
  section.card ul{margin:0 0 8px;padding-left:20px}
  section.card li{margin:5px 0;font-size:15px;color:var(--soft)}
  section.card li strong{color:var(--ink)}
  .gate{border-top:1px solid var(--line);padding:8px 0 2px;margin-top:8px;font-size:15px}
  .gate .name{font-weight:600;color:var(--accent);font-size:13.5px;
              text-transform:uppercase;letter-spacing:.04em;display:block}
  .gate p{margin:2px 0 4px;color:var(--soft)}
  .gate p strong{color:var(--ink);font-weight:600}
  .nodata{background:var(--stone);border-radius:10px;padding:14px 16px;font-size:15px;margin:0 0 10px}
  footer{margin-top:26px;font-size:13.5px;color:var(--faint);max-width:60em}
  footer p{margin:0 0 8px}
  a{color:var(--accent);font-weight:600}
</style>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../visual.css">
<script src="../shared.js" defer></script>
<script src="../visual.js" defer></script>
<script src="../tool-visual.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Router</h1>
    <p class="job">One job: one verdict per name from the forecasters that earned the top grade: Buy, Wait, Avoid, or no call, with no call as the default and the reason shown for anything else.</p>
    <p class="free">Free. No account, no sign-up, nothing to buy.</p>
  </header>
  <div class="chartbox" id="vkHost"></div>

  <div id="banner" class="banner" role="status"></div>
  <p id="meta" class="meta">Loading the Router&hellip;</p>
  <main id="results"></main>

  <footer>
    <p id="receipt"></p>
    <p><a href="../">Back to the free market tools</a></p>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var banner = document.getElementById("banner");
  var meta = document.getElementById("meta");
  var resultsEl = document.getElementById("results");
  var receiptEl = document.getElementById("receipt");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function fmtTs(iso){
    if (!iso) return null;
    var d = new Date(iso);
    return d.toLocaleString("en-US",{month:"short", day:"numeric", year:"numeric",
      hour:"numeric", minute:"2-digit", timeZone:"UTC", timeZoneName:"short"});
  }
  function gate(name, text){
    return '<div class="gate"><span class="name">' + esc(name) + "</span><p>" + esc(text) + "</p></div>";
  }
  function showBanner(kind, text){
    banner.className = "banner show " + kind;
    banner.textContent = text;
  }

  fetch("data.json", {cache:"no-store"})
    .then(function(res){
      if (!res.ok) throw new Error("missing");
      return res.json();
    })
    .then(function(data){
      if (data.state !== "published" || !data.standing_answer){
        meta.textContent = "";
        resultsEl.innerHTML = '<div class="nodata">No router record has been published yet. ' +
          "Nothing is shown for a record that has not been published.</div>";
        return;
      }
      var counts = data.counts || {};
      meta.textContent = "Proving state: " + data.proving_state + ". Source: " + data.source + ".";

      var h = "";
      h += '<section class="answer"><p class="big">Today&rsquo;s standing answer: ' +
           esc(data.standing_answer) + "</p><p>" + esc(data.standing_reason) + "</p>" +
           '<span class="tag">' + esc(data.proving_state) + "</span></section>";

      h += '<div class="counts">' +
        '<span class="count"><strong>' + counts.book_entries + '</strong> forecasters in the book</span>' +
        '<span class="count"><strong>' + counts.top_grade + '</strong> earned the top grade</span>' +
        '<span class="count"><strong>' + counts.direction_top_grade + '</strong> top-grade warning flags can set a call</span>' +
        '<span class="count"><strong>' + counts.movement_top_grade + '</strong> top-grade movement forecasters, risk warnings only</span>' +
        '<span class="count"><strong>' + counts.on_probation + '</strong> on probation, shown but never routed</span>' +
        '<span class="count"><strong>' + counts.sessions_cited + '</strong> sessions of record, too young to grade</span></div>';

      var rule = data.rule || {};
      h += '<section class="card"><h2>The routing rule, in plain words</h2>';
      h += gate("What it watches", rule.watches);
      h += "<h3>It may name a forecaster to follow only when all of this holds</h3><ul>";
      (rule.names_a_forecaster_when || []).forEach(function(item){
        h += "<li>" + esc(item) + "</li>";
      });
      h += "</ul>";
      h += gate("One name, one call", rule.one_name_one_call);
      h += gate("The verdict words", rule.labels);
      h += gate("What never sets a call", rule.never_routes);
      h += gate("Why it usually says no call", rule.why_usually_no_call);
      h += "</section>";

      h += '<section class="card"><h2>The forecasters it can route among</h2>' +
           "<p>These are the forecasters in the book as recorded, each with its own standing. " +
           "Only the warning flags can set a call today, and only an Avoid call, or Trim or Sell on a name you own.</p>";
      (data.forecasters || []).forEach(function(f){
        h += gate(f.name, "");
        h += '<div class="gate"><p><strong>What it does:</strong> ' + esc(f.what) + "</p>" +
             "<p><strong>Its standing:</strong> " + esc(f.standing) + "</p>" +
             "<p><strong>Can it set a call?</strong> " + esc(f.can_route) + "</p></div>";
      });
      h += "</section>";

      h += '<section class="card"><h2>Its session record so far</h2>';
      (data.session_record || []).forEach(function(s){
        h += "<h3>" + esc(s.date) + "</h3>";
        h += "<p>" + esc(s.what) + "</p>";
        h += '<div class="counts">' +
          '<span class="count"><strong>' + s.checked + '</strong> names checked</span>' +
          '<span class="count"><strong>' + s.avoid + '</strong> told to avoid</span>' +
          '<span class="count"><strong>' + s.no_call + '</strong> no call</span></div>';
        h += "<ul>";
        (s.avoid_names || []).forEach(function(a){
          h += "<li><strong>" + esc(a.name) + ":</strong> " + esc(a.why) + "</li>";
        });
        h += "</ul><p>" + esc(s.grades) + "</p>";
      });
      var fr = data.forward_record || {};
      h += "<h3>The rest of the record is not on record</h3><p>" + esc(fr.words) + "</p>";
      h += "</section>";

      h += '<section class="card"><h2>How young this record is</h2><p>' +
           esc(data.youth_words) + "</p><p>" + esc(data.proving_words) + "</p></section>";

      resultsEl.innerHTML = h;
      var wire = data.wire || {};
      receiptEl.textContent = "Receipt: this page is built from " + data.source.charAt(0).toLowerCase() +
        data.source.slice(1) + ". The research record behind it was run " +
        fmtTs(wire.grading_run_at) + ". On that record, the Router's own entry reads: " +
        wire.result + " (" + wire.when + ".)";
    })
    .catch(function(){
      meta.textContent = "";
      showBanner("missing", "The Router is not available right now. The data file for this page could not be loaded, so there is nothing honest to show. Please check back after the next update.");
    });
})();
</script>
</body>
</html>
