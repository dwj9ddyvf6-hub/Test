<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivors Wire: the cross-check candidate still standing, labelled unproven</title>
<style>
  :root{
    --ink:#17202b; --soft:#4a5a6d; --faint:#7c8b9d;
    --line:#dde4ec; --bg:#f5f7fa; --card:#ffffff;
    --accent:#0b5fa5;
    --bad-bg:#fdeeec; --bad-line:#e5a49c; --bad-ink:#7a2a20;
    --ok-bg:#e9f5ec; --ok-line:#9cc7a5; --ok-ink:#1e5c31;
    --part-bg:#fdf3e0; --part-line:#e8c57c; --part-ink:#6b4e12;
    --yet-bg:#eef1f5; --yet-line:#c3cedb; --yet-ink:#43536a;
    --nodata-bg:#eef1f5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 18px 56px}
  header h1{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}
  header .job{font-size:17px;color:var(--soft);margin:0 0 4px;max-width:44em}
  header .free{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 18px}
  .banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15px;display:none}
  .banner.show{display:block}
  .banner.missing{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink)}
  .meta{font-size:13.5px;color:var(--faint);margin:0 0 20px}
  .state{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;
         background:var(--part-bg);border:1px solid var(--part-line);color:var(--part-ink);margin:0 0 6px}
  .statedef{font-size:14.5px;color:var(--soft);max-width:46em;margin:0 0 20px}
  .counts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
  .count{border-radius:10px;padding:10px 14px;font-size:15px;border:1px solid var(--line);background:var(--card)}
  .count strong{font-size:19px}
  .count.standing{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
  .count.partly{background:var(--part-bg);border-color:var(--part-line);color:var(--part-ink)}
  .count.notstanding{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
  .count.notyet{background:var(--yet-bg);border-color:var(--yet-line);color:var(--yet-ink)}
  .perrecord{font-size:14.5px;color:var(--soft);margin:0 0 6px;max-width:52em}
  .perrecord strong{color:var(--ink)}
  h2.section{font-size:21px;margin:30px 0 6px}
  .sectionnote{font-size:14.5px;color:var(--soft);max-width:46em;margin:0 0 14px}
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:18px 20px;margin:0 0 16px}
  .group.candidate{border:2px solid var(--part-line);background:#fffdf6}
  .group h3{margin:0 0 6px;font-size:19px;line-height:1.35}
  .verdict{display:inline-block;border-radius:999px;padding:2px 11px;font-size:13.5px;
           font-weight:600;margin:0 0 10px;border:1px solid}
  .verdict.held{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
  .verdict.partly{background:var(--part-bg);border-color:var(--part-line);color:var(--part-ink)}
  .unproven{display:inline-block;border-radius:999px;padding:2px 11px;font-size:13.5px;font-weight:700;
            margin:0 0 10px 6px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink)}
  .gate{border-top:1px solid var(--line);padding:8px 0 2px;margin-top:8px;font-size:15px}
  .gate .name{font-weight:600;color:var(--accent);font-size:13.5px;
              text-transform:uppercase;letter-spacing:.04em;display:block}
  .gate p{margin:2px 0 4px;color:var(--soft)}
  .gate p strong{color:var(--ink);font-weight:600}
  .feed{background:var(--yet-bg);border:1px solid var(--yet-line);border-radius:10px;
        padding:14px 16px;font-size:15px;margin:0 0 10px;max-width:52em}
  .plain{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:18px 20px;margin:0 0 16px;font-size:15px}
  .plain p{margin:0 0 8px;color:var(--soft)}
  .plain p strong{color:var(--ink)}
  .nodata{background:var(--nodata-bg);border-radius:10px;padding:14px 16px;font-size:15px;margin:0 0 10px}
  footer{margin-top:26px;font-size:13.5px;color:var(--faint);max-width:60em}
  footer p{margin:0 0 8px}
  a{color:var(--accent);font-weight:600}
</style>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../visual.css">
<script src="../shared.js" defer></script>
<script src="../visual.js" defer></script>
<script src="../tool-visual.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Survivors Wire</h1>
    <p class="job">One job: the cross-check candidate that survived re-testing, shown as an unproven candidate with its full study numbers, while it earns promotion or fails in public.</p>
    <p class="free">Free. No account, no sign-up, nothing to buy.</p>
  </header>
  <div class="chartbox" id="vkHost"></div>

  <div id="banner" class="banner" role="status"></div>
  <p id="meta" class="meta">Loading the wire&hellip;</p>
  <div id="proving"></div>
  <div id="counts" class="counts"></div>
  <div id="perrecord"></div>

  <main id="results"></main>

  <footer>
    <p id="receipt"></p>
    <p><a href="../">Back to the free market tools</a></p>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var banner = document.getElementById("banner");
  var meta = document.getElementById("meta");
  var provingEl = document.getElementById("proving");
  var countsEl = document.getElementById("counts");
  var perRecordEl = document.getElementById("perrecord");
  var resultsEl = document.getElementById("results");
  var receiptEl = document.getElementById("receipt");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function fmtTs(iso){
    if (!iso) return null;
    var d = new Date(iso);
    return d.toLocaleString("en-US",{month:"short", day:"numeric", year:"numeric",
      hour:"numeric", minute:"2-digit", timeZone:"UTC", timeZoneName:"short"});
  }
  function gate(name, text){
    if (!text) return "";
    return '<div class="gate"><span class="name">' + esc(name) + "</span><p>" + esc(text) + "</p></div>";
  }
  function claimCard(c, cls, extraBadge){
    var h = '<section class="group ' + cls + '"><h3>' + esc(c.claim) + "</h3>";
    h += '<span class="verdict partly">' + esc(c.verdict_words) + "</span>" + (extraBadge || "");
    h += gate("Who made the claim", c.maker);
    h += gate("The test it survived", c.study);
    h += gate("Sample", c.sample);
    h += gate("What the test found", c.result);
    h += gate("When", c.when);
    if (c.note) h += gate("Note", c.note);
    h += "</section>";
    return h;
  }

  fetch("data.json", {cache:"no-store"})
    .then(function(res){
      if (!res.ok) throw new Error("missing");
      return res.json();
    })
    .then(function(data){
      var counts = data.counts || {};
      if (!data.candidate || data.state !== "published"){
        meta.textContent = "";
        resultsEl.innerHTML = '<div class="nodata">No survivor candidate has been published yet. ' +
          "When a cross-check candidate survives re-testing, it will appear here labelled " +
          "unproven, with its study and its numbers. Nothing is shown for a candidate " +
          "that is not on the record.</div>";
        return;
      }
      meta.textContent = "Source: " + data.source + ".";
      provingEl.innerHTML = '<span class="state">' + esc(data.proving_state) + '</span>' +
        '<p class="statedef">' + esc(data.proving_definition) + "</p>";
      countsEl.innerHTML =
        '<span class="count"><strong>' + counts.examined + '</strong> examined across the records</span>' +
        '<span class="count"><strong>' + counts.tested + '</strong> tested so far</span>' +
        '<span class="count standing"><strong>' + counts.standing + '</strong> still standing</span>' +
        '<span class="count partly"><strong>' + counts.partly + '</strong> partly standing</span>' +
        '<span class="count notstanding"><strong>' + counts.not_standing + '</strong> not standing</span>' +
        '<span class="count notyet"><strong>' + counts.not_yet + '</strong> not yet tested</span>' +
        '<span class="count notyet"><strong>' + counts.untestable + '</strong> cannot be tested on the records on hand</span>';
      var pr = "";
      (data.per_record || []).forEach(function(r){
        pr += '<p class="perrecord"><strong>' + esc(r.name) + ":</strong> " +
          r.examined + " examined, " + r.tested + " tested so far, " +
          r.standing + " standing, " + r.partly + " partly standing, " +
          r.not_standing + " not standing, " + r.not_yet + " not yet tested, " +
          r.untestable + " cannot be tested on the records on hand.</p>";
      });
      pr += '<p class="perrecord">' + esc(data.graveyard_note) + "</p>";
      perRecordEl.innerHTML = pr;

      var h = "";
      h += '<h2 class="section">The survivor candidate</h2>';
      h += '<p class="sectionnote">The records name exactly ' + data.candidate_count +
        " cross-check survivor candidate. It is a candidate, not a proven result: " +
        "its own record calls it an unproven candidate, and this page labels it that way.</p>";
      h += claimCard(data.candidate, "candidate",
        '<span class="unproven">Unproven candidate</span>');
      h += '<div class="feed"><strong>Its forward feed:</strong> ' + esc(data.feed_note) + "</div>";

      h += '<h2 class="section">Also still standing, under their own records</h2>';
      h += '<p class="sectionnote">These are not candidates on this wire. They are the items ' +
        "that stand at the top of their own records, listed here so the counts above can be " +
        "checked name by name and group by group.</p>";
      (data.held_up || []).forEach(function(c){
        var card = '<section class="group"><h3>' + esc(c.claim) + "</h3>" +
          '<span class="verdict held">' + esc(c.verdict_words) + "</span>" +
          gate("Who made the claim", c.maker) +
          gate("The test it survived", c.study) +
          gate("Sample", c.sample) +
          gate("What the test found", c.result) +
          gate("When", c.when) + "</section>";
        h += card;
      });
      var bt = data.book_top || {};
      h += '<section class="group"><h3>The book&rsquo;s entries at the top standing: ' +
        bt.count + " entries in " + (bt.groups || []).length + " groups</h3>" +
        '<span class="verdict held">' + esc(bt.standing_words) + "</span>" +
        gate("What that standing means", bt.standing_meaning);
      (bt.groups || []).forEach(function(g){
        var days = (g.days_ahead || []).map(function(d){
          return d.count + " look " + d.days + " trading days ahead";
        }).join("; ");
        h += '<div class="gate"><span class="name">' + esc(g.title) + ": " +
          g.count + (g.count === 1 ? " entry" : " entries") + '</span><p>' +
          esc(g.watches) + "</p><p>What it expects: " + esc(g.expects) +
          (days ? "</p><p>" + esc(days) + "." : "") + "</p></div>";
      });
      h += "</section>";

      h += '<h2 class="section">Partly standing</h2>';
      h += '<p class="sectionnote">' + data.partly_total + " claims partly held up. The candidate " +
        "above is one of them, counted once. The other " + (data.partly_others || []).length +
        " are listed here, in their own section, and are not survivors on this wire.</p>";
      (data.partly_others || []).forEach(function(c){
        h += claimCard(c, "", "");
      });

      var ns = data.not_standing || {};
      h += '<h2 class="section">Not standing</h2>';
      h += '<div class="plain"><p><strong>' + ns.total + " are not standing:</strong> " +
        ns.buried + ' claims did not hold up and are buried, and ' + ns.probation +
        ' book entries sit one grade down, at &ldquo;' + esc(ns.probation_words) +
        '&rdquo;, which means: ' + esc(ns.probation_meaning) + "</p>" +
        '<p>The buried claims are listed in <a href="../graveyard/">The Graveyard</a>, ' +
        'and the probation entries are listed in the <a href="../promoted-book/">Promoted Book</a>. ' +
        "Their lists live there, so they are counted here and not copied.</p></div>";

      h += '<h2 class="section">Not yet tested</h2>';
      h += '<div class="plain"><p><strong>' + data.not_yet_total + " claims are not yet tested.</strong> " +
        'They are listed on the <a href="../replication-wire/">Replication Wire</a>, ' +
        "each with the reason no finished study stands behind it yet.</p></div>";

      h += '<h2 class="section">Cannot be tested on the records on hand</h2>';
      h += '<div class="plain"><p><strong>' + data.untestable_total + " claims cannot be tested on the records on hand.</strong> " +
        'They are listed on the <a href="../replication-wire/">Replication Wire</a>, ' +
        "each naming the record that is missing. They are counted in their own " +
        "bucket here: not partly standing, and not merely not yet tested.</p></div>";

      resultsEl.innerHTML = h;
      receiptEl.textContent = "Receipt: this page is built from " +
        data.source.charAt(0).toLowerCase() + data.source.slice(1) +
        ". The verdict record behind it was run " + fmtTs(data.grading_run_at) + ".";
    })
    .catch(function(){
      meta.textContent = "";
      banner.className = "banner show missing";
      banner.textContent = "The Survivors Wire is not available right now. The data file for this page could not be loaded, so there is nothing honest to show. Please check back after the next update.";
    });
})();
</script>
</body>
</html>
