   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #181818" x="22.176" y="29.159907" transform="rotate(-0 22.176 29.159907)">From evidence to a bounded decision</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6c6c6c" x="22.176" y="45.854053" transform="rotate(-0 22.176 45.854053)">A conceptual mechanism map, not an identified causal model</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="84.42" y="131.572979" transform="rotate(-0 84.42 131.572979)">Observed evidence</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(35.516469 161.472186)">Expression, actions,</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(27.602969 172.818365)">provenance and timing</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(204.391906 125.81843)">Multidimensional</text>
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(237.769328 136.941216)">state</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(191.509172 161.68425)">Beliefs, emotion, attention</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(189.91525 172.219988)">and intent with uncertainty</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="419.58" y="131.572979" transform="rotate(-0 419.58 131.572979)">Potential demand</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(367.742594 161.472186)">Exposure, mandates,</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(367.139281 172.818365)">capital and risk limits</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="419.58" y="286.401779" transform="rotate(-0 419.58 286.401779)">Price response</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(368.247906 316.300986)">Liquidity, other flows</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(380.523937 327.647165)">and information</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="286.360763" transform="rotate(-0 252 286.360763)">Advisory decision</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(192.935859 316.300986)">Expected benefit, costs,</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(204.807641 327.647165)">risk and abstention</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; fill: #181818" transform="translate(346.0665 222.09837)">Conditional</text>
