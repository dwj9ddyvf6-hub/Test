   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6c6c6c" x="108.36" y="357.114846" transform="rotate(-0 108.36 357.114846)">Price can change later expression</text>
   </g>
   <g id="text_15">
