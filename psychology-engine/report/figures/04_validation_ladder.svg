   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #181818" x="22.176" y="30.172515" transform="rotate(-0 22.176 30.172515)">A validation ladder with separate claims</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6c6c6c" x="22.176" y="47.903461" transform="rotate(-0 22.176 47.903461)">Passing one rung does not establish the next</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="87.817783" transform="rotate(-0 252 87.817783)">1  Measurement</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="107.321753" transform="rotate(-0 252 107.321753)">Does the construct mean what the label claims?</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="146.907755" transform="rotate(-0 252 146.907755)">2  Proxy forecast</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="166.453913" transform="rotate(-0 252 166.453913)">Does it predict a prespecified observable proxy?</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="206.082103" transform="rotate(-0 252 206.082103)">3  Incremental price aware forecast</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="225.586073" transform="rotate(-0 252 225.586073)">Does it add value beyond price, news and controls?</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="265.172075" transform="rotate(-0 252 265.172075)">4  Net decision utility</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="284.718233" transform="rotate(-0 252 284.718233)">Does a decision improve after costs, risk and constraints?</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="324.304235" transform="rotate(-0 252 324.304235)">5  Authorized integration</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #181818" x="252" y="343.850393" transform="rotate(-0 252 343.850393)">Is a bounded, monitored use explicitly approved?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #6c6c6c" transform="translate(83.113797 386.976727)">At every rung: point in time data, held out evaluation, uncertainty,</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #6c6c6c" transform="translate(122.716844 399.821402)">failure analysis and an explicit stop or abstain rule.</text>
   </g>
